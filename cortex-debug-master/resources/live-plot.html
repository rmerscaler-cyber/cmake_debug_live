<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'nonce-${nonce}'; script-src 'nonce-${nonce}';">
    <title>rm_debug Live Plot</title>
    <style nonce="${nonce}">
        :root { color-scheme: light dark; }
        * { box-sizing: border-box; }
        body { margin: 0; padding: 16px; min-width: 380px; min-height: 320px; height: 100vh; display: flex; flex-direction: column; gap: 12px; background: var(--vscode-editor-background); color: var(--vscode-editor-foreground); font: 13px var(--vscode-font-family); }
        header, .toolbar, .series-row, footer { display: flex; align-items: center; gap: 10px; }
        header { justify-content: space-between; }
        h1 { font-size: 17px; margin: 0; font-weight: 600; }
        #status { color: var(--vscode-descriptionForeground); }
        .toolbar { flex-wrap: wrap; }
        button, select, input { font: inherit; color: var(--vscode-input-foreground); background: var(--vscode-input-background); border: 1px solid var(--vscode-input-border, var(--vscode-widget-border)); border-radius: 4px; padding: 5px 8px; }
        button { color: var(--vscode-button-foreground); background: var(--vscode-button-background); border-color: transparent; cursor: pointer; }
        button:hover { background: var(--vscode-button-hoverBackground); }
        button.secondary { color: var(--vscode-foreground); background: var(--vscode-button-secondaryBackground); }
        button.secondary:hover { background: var(--vscode-button-secondaryHoverBackground); }
        button.remove { padding: 2px 7px; margin-left: auto; }
        label { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
        input[type="number"] { width: 90px; }
        input[type="checkbox"] { accent-color: var(--vscode-button-background); }
        #fixedRange { display: none; gap: 6px; align-items: center; }
        #series { display: flex; flex-wrap: wrap; gap: 8px; min-height: 30px; }
        .series-row { min-width: 185px; max-width: 100%; padding: 5px 8px; border: 1px solid var(--vscode-widget-border); border-radius: 5px; }
        .series-row .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 190px; }
        .series-row .value { font-variant-numeric: tabular-nums; color: var(--vscode-descriptionForeground); }
        .swatch { width: 10px; height: 10px; border-radius: 50%; flex: none; }
        #plotWrap { position: relative; flex: 1; min-height: 180px; border: 1px solid var(--vscode-widget-border); border-radius: 6px; overflow: hidden; }
        canvas { width: 100%; height: 100%; display: block; }
        #empty { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; color: var(--vscode-descriptionForeground); pointer-events: none; padding: 20px; }
        footer { justify-content: space-between; color: var(--vscode-descriptionForeground); font-variant-numeric: tabular-nums; }
        #notice { color: var(--vscode-errorForeground); }
        #serialInfo { display: none; color: var(--vscode-descriptionForeground); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        #chooseSerial { display: none; }
    </style>
</head>
<body>
    <header><h1>Live Plot</h1><span id="status">等待 Live Watch</span></header>
    <div class="toolbar">
        <button id="pause">暂停</button>
        <button id="clear" class="secondary">清空</button>
        <button id="chooseSerial" class="secondary">选择串口变量</button>
        <label>时间窗口
            <select id="window"><option value="10">10 秒</option><option value="30" selected>30 秒</option><option value="60">60 秒</option><option value="120">120 秒</option></select>
        </label>
        <label>Y 轴
            <select id="yMode"><option value="auto">自动</option><option value="fixed">固定</option></select>
        </label>
        <span id="fixedRange"><label>最小 <input id="yMin" type="number" step="any" value="0"></label><label>最大 <input id="yMax" type="number" step="any" value="100"></label></span>
    </div>
    <div id="series"></div>
    <div id="plotWrap"><canvas id="plot"></canvas><div id="empty">在 Live Watch 的数值变量上右键，选择“Add to Live Plot”</div></div>
    <div id="serialInfo"></div>
    <footer><span id="rate">实际采样：等待数据</span><span id="last">最近更新：—</span><span id="notice"></span></footer>
    <script nonce="${nonce}">
        const vscode = acquireVsCodeApi();
        const canvas = document.getElementById('plot');
        const ctx = canvas.getContext('2d');
        const state = { series: [], history: [], paused: false, status: 'stopped', source: 'live-watch', serialInfo: '', windowSec: 30, yMode: 'auto', hidden: new Set() };
        const el = (id) => document.getElementById(id);

        function currentValue(id) {
            for (let i = state.history.length - 1; i >= 0; i--) {
                if (Object.prototype.hasOwnProperty.call(state.history[i].values, id)) {
                    return state.history[i].values[id];
                }
            }
            return null;
        }

        function renderLegend() {
            const container = el('series');
            container.replaceChildren();
            for (const item of state.series) {
                const row = document.createElement('div');
                row.className = 'series-row';
                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.checked = !state.hidden.has(item.id);
                checkbox.title = '显示或隐藏曲线';
                checkbox.addEventListener('change', () => {
                    if (checkbox.checked) { state.hidden.delete(item.id); } else { state.hidden.add(item.id); }
                    draw();
                });
                const swatch = document.createElement('span');
                swatch.className = 'swatch';
                swatch.style.backgroundColor = item.color;
                const name = document.createElement('span');
                name.className = 'name';
                name.textContent = item.label;
                name.title = item.label;
                const value = document.createElement('span');
                value.className = 'value';
                const latest = currentValue(item.id);
                value.textContent = typeof latest === 'number' && Number.isFinite(latest) ? latest.toPrecision(6) : '—';
                const remove = document.createElement('button');
                remove.className = 'secondary remove';
                remove.textContent = '×';
                remove.title = `移除 ${item.label}`;
                remove.addEventListener('click', () => vscode.postMessage({ type: 'remove', id: item.id }));
                row.append(checkbox, swatch, name, value);
                if (state.source !== 'serial') { row.append(remove); }
                container.append(row);
            }
        }

        function renderMeta() {
            el('pause').textContent = state.paused ? '继续' : '暂停';
            el('chooseSerial').style.display = state.source === 'serial' ? 'inline-block' : 'none';
            el('serialInfo').style.display = state.source === 'serial' ? 'block' : 'none';
            el('serialInfo').textContent = state.serialInfo;
            el('serialInfo').title = state.serialInfo;
            el('status').textContent = state.source === 'serial'
                ? state.status === 'running' ? '串口接收中' : state.status === 'terminated' ? '串口已断开' : '等待串口数据'
                : state.status === 'running' ? '目标运行中' : state.status === 'terminated' ? '调试会话已结束' : '目标已暂停';
            const latest = state.history[state.history.length - 1];
            const staleAfter = latest && Number.isFinite(latest.actualHz) && latest.actualHz > 0
                ? Math.max(3000, 4 * 1000 / latest.actualHz) : 3000;
            const stale = latest && state.status === 'running' && !state.paused
                && Date.now() - latest.timestampMs > staleAfter;
            el('rate').textContent = stale ? '实际采样：等待新样本'
                : latest && Number.isFinite(latest.actualHz)
                    ? `实际采样：${latest.actualHz.toFixed(1)} Hz` : '实际采样：等待数据';
            el('last').textContent = latest ? `最近更新：${new Date(latest.timestampMs).toLocaleTimeString()}` : '最近更新：—';
            el('empty').style.display = state.series.length === 0 || state.history.length === 0 ? 'flex' : 'none';
            el('empty').textContent = state.series.length === 0
                ? state.source === 'serial' ? '收到数据后点击“选择串口变量”' : '在 Live Watch 的数值变量上右键，选择“Add to Live Plot”'
                : state.source === 'serial' ? '等待 MCU 的 RM 串口数据帧' : '等待 Live Watch 的下一轮采样';
            renderLegend();
        }

        function draw() {
            const rect = canvas.getBoundingClientRect();
            const width = Math.max(1, rect.width);
            const height = Math.max(1, rect.height);
            const scale = window.devicePixelRatio || 1;
            canvas.width = Math.round(width * scale);
            canvas.height = Math.round(height * scale);
            ctx.setTransform(scale, 0, 0, scale, 0, 0);
            ctx.clearRect(0, 0, width, height);
            const leftPad = 68, rightPad = 14, topPad = 14, bottomPad = 28;
            const plotW = Math.max(1, width - leftPad - rightPad);
            const plotH = Math.max(1, height - topPad - bottomPad);
            const latest = state.history[state.history.length - 1];
            const right = state.status === 'running' && !state.paused
                ? Math.max(Date.now(), latest ? latest.timestampMs : 0)
                : latest ? latest.timestampMs : Date.now();
            const left = right - state.windowSec * 1000;
            const visible = state.history.filter((frame) => frame.timestampMs >= left && frame.timestampMs <= right);
            const shown = state.series.filter((series) => !state.hidden.has(series.id));
            let low = Infinity, high = -Infinity;
            for (const frame of visible) {
                for (const series of shown) {
                    const value = frame.values[series.id];
                    if (typeof value === 'number' && Number.isFinite(value)) {
                        low = Math.min(low, value);
                        high = Math.max(high, value);
                    }
                }
            }
            if (state.yMode === 'fixed') {
                const min = Number(el('yMin').value), max = Number(el('yMax').value);
                if (Number.isFinite(min) && Number.isFinite(max) && min < max) {
                    low = min; high = max; el('notice').textContent = '';
                } else {
                    el('notice').textContent = '固定 Y 轴需要最小值小于最大值';
                }
            } else { el('notice').textContent = ''; }
            if (!Number.isFinite(low) || !Number.isFinite(high)) { low = -1; high = 1; }
            if (low === high) { const pad = Math.max(Math.abs(low) * 0.1, 1); low -= pad; high += pad; }
            else if (state.yMode === 'auto') { const pad = (high - low) * 0.08; low -= pad; high += pad; }
            const x = (time) => leftPad + (time - left) / (right - left) * plotW;
            const y = (value) => topPad + (high - value) / (high - low) * plotH;
            ctx.strokeStyle = 'rgba(127,127,127,0.25)';
            ctx.fillStyle = getComputedStyle(document.body).color;
            ctx.font = '11px sans-serif';
            ctx.lineWidth = 1;
            for (let i = 0; i <= 4; i++) {
                const yy = topPad + plotH * i / 4;
                ctx.beginPath(); ctx.moveTo(leftPad, yy); ctx.lineTo(leftPad + plotW, yy); ctx.stroke();
                const label = (high - (high - low) * i / 4).toPrecision(4);
                ctx.fillText(label, 5, yy + 4);
                const xx = leftPad + plotW * i / 4;
                ctx.beginPath(); ctx.moveTo(xx, topPad); ctx.lineTo(xx, topPad + plotH); ctx.stroke();
                ctx.fillText(`${(-state.windowSec * (4 - i) / 4).toFixed(0)}s`, Math.max(leftPad, xx - 11), height - 8);
            }
            const recentHz = latest && Number.isFinite(latest.actualHz) ? latest.actualHz : 0;
            const gapMs = recentHz > 0 ? Math.max(1200, 3 * 1000 / recentHz) : 1200;
            for (const series of shown) {
                ctx.strokeStyle = series.color;
                ctx.lineWidth = 1.8;
                ctx.beginPath();
                let drawing = false;
                let previous = 0;
                for (const frame of visible) {
                    const value = frame.values[series.id];
                    if (typeof value !== 'number' || !Number.isFinite(value)) { drawing = false; continue; }
                    const xx = x(frame.timestampMs), yy = y(value);
                    if (!drawing || frame.timestampMs - previous > gapMs) { ctx.moveTo(xx, yy); }
                    else { ctx.lineTo(xx, yy); }
                    drawing = true;
                    previous = frame.timestampMs;
                }
                ctx.stroke();
            }
        }

        function render() { renderMeta(); draw(); }
        window.addEventListener('message', (event) => {
            const msg = event.data;
            if (msg.type === 'state') {
                state.series = msg.series;
                state.history = msg.history;
                state.paused = msg.paused;
                state.status = msg.status;
                state.source = msg.source || 'live-watch';
                state.serialInfo = msg.serialInfo || '';
                document.querySelector('h1').textContent = state.source === 'serial' ? 'Serial Plot' : 'Live Plot';
                const ids = new Set(state.series.map((series) => series.id));
                for (const id of state.hidden) { if (!ids.has(id)) { state.hidden.delete(id); } }
                render();
            } else if (msg.type === 'sampleBatch' && Array.isArray(msg.samples) && msg.samples.length) {
                state.history.push(...msg.samples);
                const cutoff = msg.samples[msg.samples.length - 1].timestampMs - 5 * 60 * 1000;
                while (state.history.length > 6000 || (state.history.length > 1 && state.history[0].timestampMs < cutoff)) { state.history.shift(); }
                render();
            } else if (msg.type === 'serialInfo') {
                state.serialInfo = msg.info || '';
                el('serialInfo').textContent = state.serialInfo;
                el('serialInfo').title = state.serialInfo;
            }
        });
        el('pause').addEventListener('click', () => vscode.postMessage({ type: state.paused ? 'resume' : 'pause' }));
        el('clear').addEventListener('click', () => vscode.postMessage({ type: 'clear' }));
        el('chooseSerial').addEventListener('click', () => vscode.postMessage({ type: 'chooseSerialChannels' }));
        el('window').addEventListener('change', (event) => { state.windowSec = Number(event.target.value); draw(); });
        el('yMode').addEventListener('change', (event) => { state.yMode = event.target.value; el('fixedRange').style.display = state.yMode === 'fixed' ? 'inline-flex' : 'none'; draw(); });
        el('yMin').addEventListener('input', draw);
        el('yMax').addEventListener('input', draw);
        if (typeof ResizeObserver !== 'undefined') { new ResizeObserver(draw).observe(el('plotWrap')); }
        else { window.addEventListener('resize', draw); }
        setInterval(() => {
            if (state.status === 'running' && !state.paused) { render(); }
        }, 1000);
        render();
        vscode.postMessage({ type: 'ready' });
    </script>
</body>
</html>
